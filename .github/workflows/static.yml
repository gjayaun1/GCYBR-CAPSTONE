# Simple workflow for deploying static content to GitHub Pages
name: Deploy Doxygen docs to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug paths
        run: |
          pwd
          ls -la
          ls -la docs || true
          ls -la docs/html || true
          find docs -maxdepth 3 -type f -name "index.html" -print || true

      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Show workspace tree
        run: |
          pwd
          echo "== top level =="
          ls -la
          echo "== tree (depth 4) =="
          find . -maxdepth 4 -type d -print
          echo "== index.html locations =="
          find . -maxdepth 6 -type f -name "index.html" -print


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/html

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
